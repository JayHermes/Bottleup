[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
bottle_up_receipts = "11111111111111111111111111111111"

[programs.devnet]
bottle_up_receipts = "11111111111111111111111111111111"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
initialize = "yarn ts-mocha -p ./tsconfig.json -t 1000000 scripts/initialize.ts"
